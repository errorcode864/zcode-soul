name: Release

# 打 v 开头的 tag 并推送后，自动构建 Windows 发行包并发布 Release 附件
on:
  push:
    tags:
      - "v*"

# gh release create 需要仓库写权限
permissions:
  contents: write

jobs:
  build-release:
    runs-on: windows-latest
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 安装 Node
        uses: actions/setup-node@v5
        with:
          node-version: "24"

      - name: 构建发行包
        run: node tools/build-release.js

      - name: 创建 Release 并上传附件
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $zip = Get-ChildItem -Path dist -Filter "*-win-x64.zip" | Select-Object -First 1
          if (-not $zip) { throw "dist 中未找到发行包 zip" }
          gh release create $env:GITHUB_REF_NAME --title $env:GITHUB_REF_NAME --generate-notes $zip.FullName
